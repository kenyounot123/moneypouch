<!DOCTYPE html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick add bar prototype</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
@font-face { font-family: "Geist"; src: url("../../../app/assets/fonts/Geist-Variable-latin.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url("../../../app/assets/fonts/GeistMono-Variable-latin.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Pixelify Sans"; src: url("../../../app/assets/fonts/PixelifySans-Variable-latin.woff2") format("woff2"); font-weight: 400 700; }
:root {
  --slate-50: oklch(98.5% 0.004 277); --slate-100: oklch(95.5% 0.010 277); --slate-200: oklch(92.5% 0.016 277);
  --slate-300: oklch(87% 0.028 277); --slate-400: oklch(76% 0.042 277); --slate-450: oklch(69% 0.048 277);
  --slate-500: oklch(62.6% 0.054 277); --slate-600: oklch(50.2% 0.061 277); --slate-700: oklch(40% 0.062 277);
  --slate-800: oklch(31% 0.060 277); --slate-850: oklch(28.5% 0.059 277); --slate-900: oklch(26.2% 0.058 277);
  --slate-950: oklch(22.5% 0.050 277); --slate-975: oklch(20.2% 0.044 277);
  --gold-100: oklch(95% 0.050 92); --gold-300: oklch(85% 0.146 90); --gold-600: oklch(56% 0.110 80);
  --green-300: oklch(81.2% 0.094 158); --green-600: oklch(53.2% 0.094 162);
  --red-300: oklch(78% 0.100 25); --red-600: oklch(55% 0.160 25);
  --white: oklch(100% 0 0);
}
@theme static {
  --background-color-level-0: light-dark(var(--white), var(--slate-975));
  --background-color-level-1: light-dark(var(--slate-50), var(--slate-950));
  --background-color-level-2: light-dark(var(--white), var(--slate-900));
  --background-color-level-3: light-dark(var(--slate-100), var(--slate-800));
  --background-color-action: var(--gold-300);
  --background-color-highlight: var(--gold-300);
  --background-color-data: light-dark(var(--slate-500), var(--slate-400));
  --background-color-data-strong: light-dark(var(--slate-600), var(--slate-200));
  --background-color-data-soft: light-dark(var(--slate-300), var(--slate-700));
  --background-color-data-track: light-dark(var(--slate-100), var(--slate-800));
  --text-color-primary: light-dark(var(--slate-900), var(--slate-50));
  --text-color-secondary: light-dark(var(--slate-700), var(--slate-400));
  --text-color-tertiary: light-dark(var(--slate-600), var(--slate-450));
  --text-color-on-action: light-dark(var(--slate-900), var(--slate-975));
  --text-color-success: light-dark(var(--green-600), var(--green-300));
  --text-color-danger: light-dark(var(--red-600), var(--red-300));
  --border-color-primary: light-dark(var(--slate-300), var(--slate-700));
  --border-color-secondary: light-dark(var(--slate-200), var(--slate-850));
  --ring-color-focus: light-dark(var(--slate-500), var(--slate-400));
  --font-sans: "Geist", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-pixel: "Pixelify Sans", "Geist", ui-sans-serif, sans-serif;
  --font-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  --text-xs: 12px; --text-xs--line-height: 16px;
  --text-sm: 13px; --text-sm--line-height: 16px;
  --text-base: 14px; --text-base--line-height: 18px;
  --text-md: 16px; --text-md--line-height: 20px;
  --text-lg: 18px; --text-lg--line-height: 22px;
  --tracking-pixel: 0.02em;
  --radius-bar: 3px; --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
  --shadow-control: 0 1px 2px #00000014;
}
@layer base {
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  body { background-color: var(--background-color-level-0); color: var(--text-color-primary); font-family: var(--font-ui); font-size: var(--text-base); line-height: var(--text-base--line-height); -webkit-font-smoothing: antialiased; }
}
.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { background: color-mix(in oklch, var(--gold-300) 45%, transparent); } to { background: transparent; } }
.drop { animation: drop .14s ease-out; }
@keyframes drop { from { opacity: 0; transform: translateY(-4px); } }
.overlay span { border-radius: 4px; }
</style>
</head>
<body>
<div class="flex min-h-dvh flex-col">
  <div class="flex items-center gap-3 border-b border-secondary bg-level-1 px-5 py-3 md:px-14">
    <span class="hidden font-pixel text-lg font-bold whitespace-nowrap tracking-pixel md:inline">Quick add</span>
    <div id="switcher" class="flex gap-1 rounded-[10px] bg-level-3 p-1"></div>
    <span class="hidden text-sm text-tertiary xl:inline">Press 1 2 with the field empty, or click. Today is Sep 27.</span>
    <div class="ml-auto flex gap-1 rounded-md bg-level-3 p-1">
      <button data-theme-set="light" class="cursor-pointer rounded-sm px-3 py-1.5 text-sm text-secondary in-data-[theme=light]:bg-level-2 in-data-[theme=light]:font-medium in-data-[theme=light]:text-primary in-data-[theme=light]:shadow-control">Light</button>
      <button data-theme-set="dark" class="cursor-pointer rounded-sm px-3 py-1.5 text-sm text-secondary in-data-[theme=dark]:bg-level-2 in-data-[theme=dark]:font-medium in-data-[theme=dark]:text-primary in-data-[theme=dark]:shadow-control">Dark</button>
    </div>
  </div>

  <main class="flex min-w-0 flex-1 flex-col gap-10 px-5 py-9 md:px-14">
    <div>
      <p id="variant-blurb" class="mb-3 text-sm text-tertiary"></p>
      <div id="bar-slot" class="relative"></div>
    </div>

    <section class="flex max-w-xl min-w-0 flex-col gap-1">
      <div class="flex items-baseline justify-between border-b border-secondary pb-3">
        <h2 class="font-pixel text-lg font-semibold tracking-pixel">Recent</h2>
        <p id="recent-count" class="text-sm text-tertiary"></p>
      </div>
      <ul id="recent" class="flex flex-col gap-1"></ul>
    </section>
  </main>
</div>

<div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 -translate-x-1/2 opacity-0 transition-opacity"></div>

<script>
const TODAY = new Date(2026, 8, 27)
const CATEGORIES = ["Housing", "Food", "Transport", "Shopping", "Fun", "Subscriptions", "Health", "Income"]
const MONTHS = Object.fromEntries(["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"].flatMap((m, i) => [[m, i]]).concat([["sept", 8]]))
const WEEKDAYS = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"]

let rows = [
  { name: "Blue Bottle", category: "Food", date: new Date(2026, 8, 26), cents: -550 },
  { name: "Trader Joe's", category: "Food", date: new Date(2026, 8, 25), cents: -6412 },
  { name: "Clipper card", category: "Transport", date: new Date(2026, 8, 25), cents: -2000 },
  { name: "Spotify", category: "Subscriptions", date: new Date(2026, 8, 24), cents: -1199 },
  { name: "Uniqlo", category: "Shopping", date: new Date(2026, 8, 22), cents: -4990 },
  { name: "Lyft", category: "Transport", date: new Date(2026, 8, 20), cents: -1830 },
  { name: "Walgreens", category: "Health", date: new Date(2026, 8, 18), cents: -2104 },
  { name: "Paycheck", category: "Income", date: new Date(2026, 8, 15), cents: 240000 },
]
let lastAdded = null

function parse(line) {
  const tokens = [...line.matchAll(/\S+/g)].map(m => ({ text: m[0], start: m.index, end: m.index + m[0].length, kind: null }))
  let date = null
  for (let i = 0; i < tokens.length - 1 && !date; i++) {
    const m = MONTHS[tokens[i].text.toLowerCase()], d = tokens[i + 1].text.match(/^(\d{1,2})(st|nd|rd|th)?$/i)
    if (m !== undefined && d) { date = latest(m, +d[1]); if (date) tokens[i].kind = tokens[i + 1].kind = "date" }
  }
  for (const t of tokens) {
    if (date || t.kind) break
    const w = t.text.toLowerCase(), s = t.text.match(/^(\d{1,2})\/(\d{1,2})$/)
    if (w === "today") date = TODAY
    else if (w === "yesterday") date = new Date(2026, 8, 26)
    else if (WEEKDAYS.includes(w)) date = new Date(2026, 8, 27 - ((TODAY.getDay() - WEEKDAYS.indexOf(w) + 7) % 7))
    else if (s) date = latest(+s[1] - 1, +s[2])
    if (date) t.kind = "date"
  }
  let categoryWord = null
  for (const t of tokens) if (!t.kind && !categoryWord && t.text.startsWith("#")) { t.kind = "category"; categoryWord = t.text.slice(1) }
  const amounts = tokens.filter(t => !t.kind).map(t => ({ t, m: t.text.match(/^([+-])?(\$)?(\d{1,3}(?:,\d{3})+|\d+)?(?:\.(\d{1,2}))?$/) }))
    .filter(a => a.m && (a.m[3] || a.m[4]))
  const pick = amounts.find(a => a.m[1] || a.m[2] || a.m[4] || a.m[3]?.includes(",")) || amounts.at(-1)
  let cents = null, signTyped = false
  if (pick) {
    const v = parseInt((pick.m[3] || "0").replaceAll(",", "")) * 100 + parseInt((pick.m[4] || "0").padEnd(2, "0"))
    if (v > 0) { cents = pick.m[1] === "+" ? v : -v; signTyped = !!pick.m[1]; pick.t.kind = "amount" }
  }
  const name = tokens.filter(t => !t.kind).map(t => t.text).join(" ")
  let category = null, inferred = false, newCategory = false
  if (categoryWord) {
    category = CATEGORIES.find(c => c.toLowerCase() === categoryWord.toLowerCase()) || categoryWord
    newCategory = !CATEGORIES.some(c => c.toLowerCase() === categoryWord.toLowerCase()) && categoryWord.length > 0
  } else if (name) {
    const hit = rows.find(r => r.name.toLowerCase() === name.toLowerCase())
    if (hit) { category = hit.category; inferred = true }
  }
  const errors = [cents === null && "Add an amount", !name && "Add a name"].filter(Boolean)
  const last = name && rows.find(r => r.name.toLowerCase() === name.toLowerCase())
  if (cents !== null && !signTyped && last && last.cents > 0) cents = -cents
  return { tokens, name, cents, date: date || TODAY, dateTyped: !!date, category, inferred, newCategory, categoryWord, errors }
}

function latest(month, day) {
  for (let y = 2026; y >= 2022; y--) { const d = new Date(y, month, day); if (d.getMonth() === month && d <= TODAY) return d }
  return null
}

const money = c => (c > 0 ? "+" : "") + "$" + (Math.abs(c) / 100).toLocaleString("en-US", { minimumFractionDigits: 2 })
const day = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + (d.getFullYear() !== 2026 ? ", " + d.getFullYear() : "")
const relDay = d => +d === +TODAY ? "Today" : +d === +new Date(2026, 8, 26) ? "Yesterday" : day(d)
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])

function commit(p, line) {
  const row = { name: p.name, category: p.category, date: p.date, cents: p.cents, fresh: true, line }
  if (p.newCategory) CATEGORIES.push(p.category)
  rows = [row, ...rows].sort((a, b) => b.date - a.date || (b.fresh ? 1 : 0) - (a.fresh ? 1 : 0))
  lastAdded = row
  renderRecent(row)
  return row
}

function undo() {
  if (!lastAdded) return null
  const row = lastAdded
  rows = rows.filter(r => r !== row)
  lastAdded = null
  renderRecent()
  return row
}

function renderRecent(flashRow) {
  document.getElementById("recent-count").textContent = `${rows.length} this month`
  document.getElementById("recent").innerHTML = rows.slice(0, 8).map(r => `
    <li class="flex items-center gap-3 border-b border-secondary py-3 last:border-b-0 ${r === flashRow ? "flash" : ""}">
      <div class="flex w-2 shrink-0 justify-center">${r === lastAdded ? '<div class="size-1.5 rounded-[1px] bg-highlight"></div>' : ""}</div>
      <div class="flex min-w-0 flex-1 flex-col gap-0.5">
        <p class="font-medium">${esc(r.name)}</p>
        <p class="text-sm text-tertiary">${esc(r.category || "Uncategorized")} · ${day(r.date)}</p>
      </div>
      <p class="w-[90px] shrink-0 text-right font-mono ${r.cents > 0 ? "text-success" : ""}">${money(r.cents)}</p>
    </li>`).join("")
}

let toastTimer
function toast(html, ms = 5000) {
  const el = document.getElementById("toast")
  el.innerHTML = `<div class="pointer-events-auto flex items-center gap-4 rounded-lg border border-primary bg-level-2 py-2.5 pr-2.5 pl-4 shadow-control">${html}</div>`
  el.style.opacity = 1
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => el.style.opacity = 0, ms)
  el.querySelector("[data-undo]")?.addEventListener("click", () => doUndo())
}
function hideToast() { document.getElementById("toast").style.opacity = 0 }

let doUndo = () => {}

const PLUS = `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" class="shrink-0 stroke-(--background-color-data)" aria-hidden="true"><path d="M9 3v12M3 9h12" stroke-width="1.8" stroke-linecap="round" /></svg>`
const BAR = "flex h-15 shrink-0 items-center gap-3 rounded-lg border border-primary bg-level-2 pr-2 pl-5 shadow-xs focus-within:border-(--ring-color-focus)"
const INPUT = "min-w-0 flex-1 bg-transparent text-md outline-none placeholder:text-tertiary"
const BUTTON = "shrink-0 cursor-pointer rounded-md bg-action px-4 py-2.5 font-pixel text-[15px] leading-[18px] font-semibold whitespace-nowrap tracking-pixel text-on-action hover:brightness-95 disabled:cursor-default disabled:opacity-40 disabled:hover:brightness-100"
const PILL = "rounded-full bg-level-3 px-2.5 py-1 text-sm font-medium whitespace-nowrap"
const KBD = "rounded-sm border border-primary bg-level-2 px-1.5 py-0.5 font-mono text-xs text-secondary"

function undoToast(row) {
  toast(`<span class="text-sm">Added <span class="font-medium">${esc(row.name)}</span> <span class="font-mono">${money(row.cents)}</span></span>
    <button data-undo class="cursor-pointer rounded-sm px-2 py-1 text-sm font-medium text-secondary hover:bg-level-3 hover:text-primary">Undo <span class="${KBD}">⌘Z</span></button>`)
}


const DANGER_BOX = "inline-flex items-center gap-1.5 whitespace-nowrap rounded-sm border border-(--text-color-danger) bg-(--text-color-danger)/10 px-2 py-1 text-sm font-medium text-danger"
const SLOT = "inline-flex items-center whitespace-nowrap rounded-sm border border-dashed border-primary px-1.5 py-0.5 font-mono text-xs text-tertiary"
const WARN = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5v4M8 11v.5" stroke-linecap="round"/></svg>`
const MISSING_AMOUNT = "Type an amount, like 5.50"
const MISSING_NAME = "Type a name, like coffee"

function legendMarkup(p, typed) {
  const parts = [
    { key: "5.50", label: "amount", on: p.cents !== null && p.cents < 0, missing: typed && p.cents === null },
    { key: "yesterday", alt: "sep 24", label: "date", on: p.dateTyped },
    { key: "#food", label: "category", on: !!p.categoryWord },
    { key: "+20", label: "money in", on: p.cents > 0 },
  ]
  return parts.map(x => `
    <span class="inline-flex items-center gap-1.5 whitespace-nowrap ${x.on ? "text-primary" : x.missing ? "text-danger" : "text-tertiary"}">
      <span class="rounded-sm border px-1.5 py-0.5 font-mono text-xs ${x.on ? "border-transparent bg-highlight text-on-action" : x.missing ? "border-(--text-color-danger)" : "border-primary bg-level-2"}">${x.key}</span>${x.alt ? `<span class="rounded-sm border border-primary bg-level-2 px-1.5 py-0.5 font-mono text-xs ${x.on ? "hidden" : ""}">${x.alt}</span>` : ""}
      <span class="text-sm">${x.label}${x.on ? " ✓" : ""}</span>
    </span>`).join("")
}

function mountPreview(slot, mode) {
  slot.innerHTML = `
    <div class="${BAR}">
      ${PLUS}
      <input id="qa" type="text" aria-label="Quick add" placeholder="coffee 5.50 yesterday" autocomplete="off" class="${INPUT}">
      <button id="add" type="button" class="${BUTTON}">Add ↵</button>
    </div>
    <div id="preview" class="mx-3 rounded-b-lg border border-t-0 border-secondary bg-level-1 px-4"></div>`
  const input = slot.querySelector("#qa"), preview = slot.querySelector("#preview"), button = slot.querySelector("#add")
  const render = () => {
    const v = input.value, typed = !!v.trim(), p = parse(v)
    button.disabled = !typed || p.errors.length > 0
    const nameHtml = p.name ? esc(p.name)
      : typed ? `<span class="${DANGER_BOX}">${WARN}${MISSING_NAME}</span>`
      : mode === "slots" ? `<span class="font-normal text-tertiary">What was it?</span>` : ""
    const amountHtml = p.cents !== null ? `<span class="${p.cents > 0 ? "text-success" : ""}">${money(p.cents)}</span>`
      : typed ? `<span data-error class="${DANGER_BOX} font-sans">${WARN}${MISSING_AMOUNT}</span>`
      : `<span class="${SLOT}">5.50</span>`
    const categoryHtml = p.category
      ? esc(p.category) + (p.inferred ? ' <span class="text-xs">(usual)</span>' : p.newCategory ? ' <span class="text-xs">(new)</span>' : "")
      : mode === "slots" ? `<span class="${SLOT}">#food</span>` : "Uncategorized"
    const dateHtml = mode === "slots" && !p.dateTyped
      ? `Today <span class="${SLOT} ml-1">yesterday</span> <span class="${SLOT}">sep 24</span>`
      : relDay(p.date)
    const row = typed || mode === "slots" ? `
      <div class="flex flex-wrap items-center gap-x-3 gap-y-2 py-3">
        <div class="flex w-2 shrink-0 justify-center"><div class="size-1.5 rounded-[1px] border border-(--background-color-highlight)"></div></div>
        <div class="flex min-w-0 flex-1 basis-44 flex-col gap-1">
          <p class="truncate font-medium">${nameHtml || "&nbsp;"}</p>
          <p class="flex flex-wrap items-center gap-x-1 gap-y-1 text-sm text-tertiary">${categoryHtml} · ${dateHtml}${mode === "slots" && !(p.cents > 0) ? ` <span class="ml-2 text-xs">money in</span> <span class="${SLOT}">+20</span>` : ""}</p>
        </div>
        <p class="ml-auto shrink-0 text-right font-mono">${amountHtml}</p>
      </div>` : ""
    const legend = mode === "legend" ? `<div class="flex flex-wrap items-center gap-x-5 gap-y-2 ${row ? "border-t border-secondary" : ""} py-3">${legendMarkup(p, typed)}</div>` : ""
    preview.innerHTML = row + legend
  }
  const submit = () => {
    const p = parse(input.value)
    if (!input.value.trim() || p.errors.length) {
      preview.querySelectorAll(`.${CSS.escape("text-danger")}`).forEach(el => el.animate([{ transform: "translateX(-3px)" }, { transform: "translateX(3px)" }, { transform: "translateX(-2px)" }, { transform: "none" }], 220))
      return
    }
    undoToast(commit(p, input.value)); input.value = ""; render()
  }
  doUndo = () => { const r = undo(); if (r) { input.value = r.line; render(); hideToast() } input.focus() }
  input.addEventListener("input", render)
  input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); if (e.key === "z" && (e.metaKey || e.ctrlKey) && !input.value) { e.preventDefault(); doUndo() } })
  button.addEventListener("click", submit)
  render(); input.focus()
}

function assistLegend(p, typed) {
  const parts = [
    { keys: ["5.50"], label: "amount", on: p.cents !== null && p.cents < 0, missing: typed && p.cents === null },
    { keys: ["@"], label: "date", on: p.dateTyped },
    { keys: ["#"], label: "category", on: !!p.categoryWord },
  ]
  return parts.map(x => `
    <span class="inline-flex items-center gap-1.5 whitespace-nowrap ${x.on ? "text-primary" : x.missing ? "text-danger" : "text-tertiary"}">
      ${x.keys.map(k => `<span class="rounded-sm border px-1.5 py-0.5 font-mono text-xs ${x.on ? "border-transparent bg-highlight text-on-action" : x.missing ? "border-(--text-color-danger)" : "border-primary bg-level-2"}">${k}</span>`).join("")}
      <span class="text-sm">${x.label}${x.on ? " ✓" : ""}</span>
    </span>`).join("")
}

const sameDay = (a, b) => +a === +b
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n)
const clampPast = d => d > TODAY ? TODAY : d
function dateWord(d) {
  if (sameDay(d, TODAY)) return "today"
  if (sameDay(d, addDays(TODAY, -1))) return "yesterday"
  const m = d.toLocaleDateString("en-US", { month: "short" }).toLowerCase()
  return `${m} ${d.getDate()}${d.getFullYear() !== TODAY.getFullYear() ? " " + d.getFullYear() : ""}`
}

function mountAssist(slot) {
  slot.innerHTML = `
    <div class="${BAR}">
      ${PLUS}
      <input id="qa" type="text" aria-label="Quick add" placeholder="coffee 5.50 yesterday" autocomplete="off" spellcheck="false" class="${INPUT}">
      <button id="add" type="button" class="${BUTTON}">Add ↵</button>
    </div>
    <div id="preview" class="mx-3 rounded-b-lg border border-t-0 border-secondary bg-level-1 px-4"></div>
    <div id="popup" class="absolute top-16 z-10 hidden rounded-md border border-primary bg-level-2 p-1 shadow-control"></div>`
  const input = slot.querySelector("#qa"), preview = slot.querySelector("#preview"), popup = slot.querySelector("#popup"), button = slot.querySelector("#add")
  let open = null, suggestion = ""

  const caretWord = () => {
    const upto = input.value.slice(0, input.selectionStart), m = upto.match(/(\S*)$/)
    return { text: m[1], start: upto.length - m[1].length, end: input.selectionStart }
  }
  const replaceWord = (w, text) => {
    const rest = input.value.slice(w.end).replace(/^\S*/, "").trimStart()
    input.value = input.value.slice(0, w.start) + text + " " + rest
    const pos = w.start + text.length + 1
    input.setSelectionRange(pos, pos)
    open = null
    render()
  }
  const place = w => {
    const probe = document.createElement("span")
    probe.className = "invisible absolute text-md whitespace-pre"
    probe.textContent = input.value.slice(0, w.start)
    document.body.append(probe)
    const x = input.getBoundingClientRect().left - slot.getBoundingClientRect().left + probe.offsetWidth - input.scrollLeft
    probe.remove()
    popup.style.left = Math.max(0, Math.min(x - 8, slot.clientWidth - popup.offsetWidth)) + "px"
  }

  const renderPopup = () => {
    if (!open) { popup.classList.add("hidden"); return }
    popup.classList.remove("hidden")
    if (open.kind === "category") {
      const typedName = open.query
      popup.className = popup.className.replace(/\bw-\S+/g, "") + " w-56"
      popup.innerHTML = open.items.map((c, i) => `
          <button data-pick="${i}" class="flex w-full cursor-pointer items-center justify-between rounded-sm px-2.5 py-1.5 text-left ${i === open.index ? "bg-level-3" : ""}">
            <span>${esc(c)}</span>
          </button>`).join("")
        + (typedName && !CATEGORIES.some(c => c.toLowerCase() === typedName.toLowerCase())
          ? `<button data-pick="new" class="flex w-full cursor-pointer items-center justify-between rounded-sm px-2.5 py-1.5 text-left ${open.index === open.items.length ? "bg-level-3" : ""}"><span>New category <span class="font-medium">${esc(typedName)}</span></span>${open.index === open.items.length ? `<span class="${KBD}">Tab</span>` : ""}</button>` : "")
    } else {
      const c = open.cursor, first = new Date(c.getFullYear(), c.getMonth(), 1), days = new Date(c.getFullYear(), c.getMonth() + 1, 0).getDate()
      const cells = Array(first.getDay()).fill("<span></span>").concat(Array.from({ length: days }, (_, i) => {
        const d = new Date(c.getFullYear(), c.getMonth(), i + 1), future = d > TODAY
        const cls = sameDay(d, c) ? "bg-highlight font-semibold text-on-action" : future ? "text-tertiary opacity-40" : "hover:bg-level-3"
        return `<button data-day="${+d}" ${future ? "disabled" : ""} class="flex h-8 cursor-pointer items-center justify-center rounded-sm font-mono text-sm disabled:cursor-default ${cls} ${sameDay(d, TODAY) && !sameDay(d, c) ? "underline decoration-2 underline-offset-4" : ""}">${i + 1}</button>`
      }))
      popup.className = popup.className.replace(/\bw-\S+/g, "") + " w-[264px]"
      popup.innerHTML = `
        <div class="flex items-center justify-between px-2 pt-1.5 pb-2">
          <button data-month="-1" class="cursor-pointer rounded-sm px-2 text-secondary hover:bg-level-3">‹</button>
          <span class="font-medium">${c.toLocaleDateString("en-US", { month: "long", year: "numeric" })}</span>
          <button data-month="1" class="cursor-pointer rounded-sm px-2 text-secondary hover:bg-level-3">›</button>
        </div>
        <div class="grid grid-cols-7 gap-0.5 px-1 text-center">
          ${["S", "M", "T", "W", "T", "F", "S"].map(d => `<span class="pb-1 text-xs text-tertiary">${d}</span>`).join("")}
          ${cells.join("")}
        </div>
        <div class="mt-1.5 flex flex-wrap gap-x-3 gap-y-1.5 border-t border-secondary px-2 pt-2 pb-1 text-xs text-tertiary">
          <span><span class="${KBD}">←↑↓→</span> move</span><span><span class="${KBD}">t</span> today</span><span><span class="${KBD}">y</span> yesterday</span>
        </div>`
    }
    place(open.word)
  }

  const render = () => {
    const v = input.value, typed = !!v.trim(), p = parse(v.replace(/(^|\s)@(?=\s|$)/, "$1"))
    const w = caretWord()
    if (w.text.startsWith("#")) {
      const q = w.text.slice(1).toLowerCase(), usual = rows.find(r => r.name.toLowerCase() === p.name.toLowerCase())?.category
      const items = CATEGORIES.filter(c => c.toLowerCase().startsWith(q)).sort((a, b) => (b === usual) - (a === usual))
      const max = items.length + (q && !CATEGORIES.some(c => c.toLowerCase() === q) ? 1 : 0) - 1
      open = { kind: "category", word: w, query: w.text.slice(1), usual, items, index: Math.min(open?.kind === "category" ? open.index : 0, Math.max(0, max)), max }
    } else if (w.text === "@") {
      if (open?.kind !== "date") open = { kind: "date", word: w, cursor: p.date }
      else open.word = w
    } else open = null

    suggestion = ""
    if (!open && input.selectionStart === v.length && !p.tokens.some(t => t.kind) && v.trim().length >= 2) {
      const hit = [...new Set(rows.map(r => r.name))].find(n => n.toLowerCase().startsWith(v.trimStart().toLowerCase()) && n.length > v.trimStart().length)
      if (hit) suggestion = hit.slice(v.trimStart().length)
    }

    button.disabled = !typed || p.errors.length > 0
    const nameHtml = suggestion
      ? `${esc(v.trimStart())}<span class="font-normal text-tertiary">${esc(suggestion)}</span> <span class="${KBD} font-normal">Tab</span>`
      : p.name ? esc(p.name) : typed ? `<span class="${DANGER_BOX}">${WARN}${MISSING_NAME}</span>` : ""
    const amountHtml = p.cents !== null ? (p.cents > 0 ? `<span class="flex flex-col items-end gap-0.5 text-success"><span>${money(p.cents)}</span><span class="font-sans text-xs">Money in</span></span>` : money(p.cents))
      : `<span data-error class="${DANGER_BOX} font-sans">${WARN}${MISSING_AMOUNT}</span>`
    const shown = suggestion ? parse(v.trimStart() + suggestion) : p
    const categoryHtml = suggestion && shown.category ? esc(shown.category) : p.category ? esc(p.category) + (p.newCategory ? ' <span class="text-xs">(new)</span>' : "") : "Uncategorized"
    const row = typed ? `
      <div class="flex flex-wrap items-center gap-x-3 gap-y-2 py-3">
        <div class="flex w-2 shrink-0 justify-center"><div class="size-1.5 rounded-[1px] border border-(--background-color-highlight)"></div></div>
        <div class="flex min-w-0 flex-1 basis-44 flex-col gap-1">
          <p class="truncate font-medium">${nameHtml || "&nbsp;"}</p>
          <p class="text-sm text-tertiary">${categoryHtml} · ${relDay(open?.kind === "date" ? open.cursor : p.date)}</p>
        </div>
        <p class="ml-auto shrink-0 text-right font-mono">${amountHtml}</p>
      </div>` : ""
    preview.innerHTML = row + `<div class="flex flex-wrap items-center gap-x-5 gap-y-2 ${row ? "border-t border-secondary" : ""} py-3">${assistLegend(p, typed)}</div>`
    renderPopup()
  }

  const pickCategory = () => {
    const name = open.index < open.items.length ? open.items[open.index] : open.query
    if (!name) return
    replaceWord(open.word, "#" + name)
  }
  const pickDate = d => replaceWord(open.word, dateWord(d))
  const closeDate = () => { const w = open.word; input.value = input.value.slice(0, w.start) + input.value.slice(w.start + 1); input.setSelectionRange(w.start, w.start); open = null }

  popup.addEventListener("mousedown", e => {
    e.preventDefault()
    const pick = e.target.closest("[data-pick]"), day = e.target.closest("[data-day]"), month = e.target.closest("[data-month]")
    if (pick) { open.index = pick.dataset.pick === "new" ? open.items.length : +pick.dataset.pick; pickCategory() }
    if (day && !day.disabled) pickDate(new Date(+day.dataset.day))
    if (month) { const c = open.cursor; open.cursor = clampPast(new Date(c.getFullYear(), c.getMonth() + +month.dataset.month, Math.min(c.getDate(), 28))); renderPopup(); render() }
  })

  const submit = () => {
    const p = parse(input.value)
    if (!input.value.trim() || p.errors.length) {
      preview.querySelectorAll("[data-error], .text-danger").forEach(el => el.animate([{ transform: "translateX(-3px)" }, { transform: "translateX(3px)" }, { transform: "translateX(-2px)" }, { transform: "none" }], 220))
      return
    }
    undoToast(commit(p, input.value)); input.value = ""; render()
  }
  doUndo = () => { const r = undo(); if (r) { input.value = r.line; render(); hideToast() } input.focus() }

  input.addEventListener("input", render)
  input.addEventListener("click", render)
  input.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== input) { if (open?.kind === "date") closeDate(); open = null; render() } }, 0))
  input.addEventListener("keydown", e => {
    if (open?.kind === "category") {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); open.index = (open.index + (e.key === "ArrowDown" ? 1 : open.max)) % (open.max + 1); renderPopup(); return }
      if (e.key === "Tab" || e.key === "Enter") { e.preventDefault(); pickCategory(); return }
      if (e.key === "Escape") { open = null; renderPopup(); return }
    }
    if (open?.kind === "date") {
      const moves = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }
      if (moves[e.key]) { e.preventDefault(); open.cursor = clampPast(addDays(open.cursor, moves[e.key])); render(); return }
      if (e.key === "PageUp" || e.key === "PageDown") { e.preventDefault(); const c = open.cursor; open.cursor = clampPast(new Date(c.getFullYear(), c.getMonth() + (e.key === "PageUp" ? -1 : 1), Math.min(c.getDate(), 28))); render(); return }
      if (e.key === "Tab" || e.key === "Enter") { e.preventDefault(); pickDate(open.cursor); return }
      if (e.key === "t" || e.key === "y") { e.preventDefault(); pickDate(e.key === "t" ? TODAY : addDays(TODAY, -1)); return }
      if (e.key === "Escape") { e.preventDefault(); closeDate(); render(); return }
      if (e.key.length === 1) closeDate()
    }
    if (e.key === "Tab" && suggestion) { e.preventDefault(); input.value = input.value.trimStart() + suggestion + " "; render(); return }
    if (e.key === "Enter") submit()
    if (e.key === "z" && (e.metaKey || e.ctrlKey) && !input.value) { e.preventDefault(); doUndo() }
  })
  button.addEventListener("click", submit)
  render(); input.focus()
}

const VARIANTS = {
  legend: {
    label: "C1 · Legend",
    blurb: "C1. Same preview row. A legend under it lists what you can type, and each part lights up once the line uses it. A missing amount is a red callout in the amount spot.",
    mount(slot) { mountPreview(slot, "legend") },
  },

  assist: {
    label: "C3 · Assist",
    blurb: "C3. C1 plus typing help. # opens your categories, @ opens a calendar you drive with arrow keys, and Tab finishes a name you have used before.",
    mount(slot) { mountAssist(slot) },
  },
}

const keys = ["legend", "assist"]
function show(key) {
  hideToast()
  document.getElementById("switcher").innerHTML = keys.map(k => `<button data-variant="${k}" class="cursor-pointer rounded-sm px-3 py-1.5 text-sm whitespace-nowrap ${k === key ? "bg-level-2 font-medium text-primary shadow-control" : "text-secondary"}">${VARIANTS[k].label}</button>`).join("")
  document.getElementById("variant-blurb").textContent = VARIANTS[key].blurb
  VARIANTS[key].mount(document.getElementById("bar-slot"))
  history.replaceState(null, "", "#" + key)
}
document.getElementById("switcher").addEventListener("click", e => { const b = e.target.closest("[data-variant]"); if (b) show(b.dataset.variant) })
document.addEventListener("keydown", e => { if (/^[1-2]$/.test(e.key) && !e.target.value) { e.preventDefault(); show(keys[+e.key - 1]) } })
document.querySelectorAll("[data-theme-set]").forEach(b => b.addEventListener("click", () => document.documentElement.dataset.theme = b.dataset.themeSet))
renderRecent()
show(keys.includes(location.hash.slice(1)) ? location.hash.slice(1) : "assist")
</script>
</body>
</html>
