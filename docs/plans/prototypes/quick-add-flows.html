@font-face { font-family: "Geist"; src: url("../../../app/assets/fonts/Geist-Variable-latin.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url("../../../app/assets/fonts/GeistMono-Variable-latin.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Pixelify Sans"; src: url("../../../app/assets/fonts/PixelifySans-Variable-latin.woff2") format("woff2"); font-weight: 400 700; }
:root {
  --slate-50: oklch(98.5% 0.004 277); --slate-100: oklch(95.5% 0.010 277); --slate-200: oklch(92.5% 0.016 277);
  --slate-300: oklch(87% 0.028 277); --slate-400: oklch(76% 0.042 277); --slate-450: oklch(69% 0.048 277);
  --slate-500: oklch(62.6% 0.054 277); --slate-600: oklch(50.2% 0.061 277); --slate-700: oklch(40% 0.062 277);
  --slate-800: oklch(31% 0.060 277); --slate-850: oklch(28.5% 0.059 277); --slate-900: oklch(26.2% 0.058 277);
  --slate-950: oklch(22.5% 0.050 277); --slate-975: oklch(20.2% 0.044 277);
  --gold-100: oklch(95% 0.050 92); --gold-300: oklch(85% 0.146 90); --gold-600: oklch(56% 0.110 80);

<style type="text/tailwindcss">
@theme static {
  --background-color-level-0: light-dark(var(--white), var(--slate-975));
  --background-color-level-1: light-dark(var(--slate-50), var(--slate-950));
  --background-color-level-2: light-dark(var(--white), var(--slate-900));
  --background-color-level-3: light-dark(var(--slate-100), var(--slate-800));
  --background-color-action: var(--gold-300);
  --background-color-highlight: var(--gold-300);
  --background-color-data: light-dark(var(--slate-500), var(--slate-400));
  --background-color-data-strong: light-dark(var(--slate-600), var(--slate-200));
  --background-color-data-soft: light-dark(var(--slate-300), var(--slate-700));
  --background-color-data-track: light-dark(var(--slate-100), var(--slate-800));
  --text-color-primary: light-dark(var(--slate-900), var(--slate-50));
  --text-color-secondary: light-dark(var(--slate-700), var(--slate-400));

  --border-color-primary: light-dark(var(--slate-300), var(--slate-700));
  --border-color-secondary: light-dark(var(--slate-200), var(--slate-850));
  --font-sans: "Geist", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-pixel: "Pixelify Sans", "Geist", ui-sans-serif, sans-serif;
  --text-xs: 12px; --text-xs--line-height: 16px;
  --text-sm: 13px; --text-sm--line-height: 16px;

  --radius-bar: 3px; --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
  --container-sidebar: 240px;
  --shadow-control: 0 1px 2px #00000014;
}
@layer base {
  :root { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  body { background-color: var(--background-color-level-0); color: var(--text-color-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; line-height: 18px; -webkit-font-smoothing: antialiased; }
}
.tok-amount { background: color-mix(in oklch, var(--gold-300) 45%, transparent); border-radius: 3px; }
.tok-date { background: var(--background-color-level-3); border-radius: 3px; box-shadow: inset 0 -1.5px 0 var(--background-color-data); }
.tok-category { color: var(--background-color-data-strong); font-weight: 500; }
.mirror, .mirror-input { font: 16px/20px var(--font-sans); letter-spacing: 0; white-space: pre; }
.mirror-input { color: transparent; caret-color: var(--text-color-primary); }
.mirror-input::selection { color: transparent; background: color-mix(in oklch, var(--slate-400) 40%, transparent); }
@keyframes arrive { from { background: color-mix(in oklch, var(--gold-300) 35%, transparent); } to { background: transparent; } }
.arrived { animation: arrive 1.6s ease-out; }
:root[data-theme="dark"] .arrived { animation-name: arrive-dark; }
@keyframes arrive-dark { from { background: color-mix(in oklch, var(--gold-300) 14%, transparent); } to { background: transparent; } }
</style>

<div id="toast" role="status" hidden class="fixed bottom-6 left-1/2 z-40 -translate-x-1/2 rounded-md bg-level-3 px-4 py-2.5 text-sm shadow-xs"></div>

<div class="fixed bottom-3 left-3 z-50 flex flex-col gap-2 rounded-lg border border-primary bg-level-2 p-2.5 text-xs shadow-xs" id="switcher">

    <button data-flow="bar" class="rounded-sm px-2 py-1">1 Bar</button>

  </div>
  <p class="text-tertiary">Alt+1/2/3 switch flow. Outside the field: n, j, k, dd, u.</p>

<script>
const TODAY = new Date(2026, 9, 4)
const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"]
const WEEKDAYS = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"]

const VOCAB = {
  transaction: { one: "transaction", many: "transactions", listNav: "Transactions", button: "Add it", emptyRecent: "Nothing yet. Try coffee 5.50 above.", deleted: "Deleted. Press u to undo.", added: "Added", placeholder: "coffee 5.50 yesterday", draftRow: "Add a transaction" },
  entry: { one: "entry", many: "entries", listNav: "Ledger", button: "Enter it", emptyRecent: "Nothing yet. Try coffee 5.50 above.", deleted: "Removed. Press u to undo.", added: "Entered", placeholder: "coffee 5.50 yesterday", draftRow: "New entry" },
  slip: { one: "slip", many: "slips", listNav: "Slips", button: "Stash it", emptyRecent: "Nothing yet. Try coffee 5.50 above.", deleted: "Removed. Press u to undo.", added: "Stashed", placeholder: "coffee 5.50 yesterday", draftRow: "Stash a slip" },
}

const state = {
  flow: localStorage.getItem("flow") || "bar",
  vocab: localStorage.getItem("vocab") || "slip",
  rows: [
    { id: 8, name: "Blue Bottle", category: "Food", date: new Date(2026, 9, 3), cents: -550 },
    { id: 7, name: "Trader Joe's", category: "Food", date: new Date(2026, 9, 2), cents: -6412 },
    { id: 6, name: "Clipper card", category: "Transport", date: new Date(2026, 9, 2), cents: -2000 },
    { id: 5, name: "Spotify", category: "Subscriptions", date: new Date(2026, 9, 1), cents: -1199 },
    { id: 4, name: "Rent", category: "Housing", date: new Date(2026, 9, 1), cents: -165000 },
    { id: 3, name: "Blue Bottle", category: "Food", date: new Date(2026, 8, 29), cents: -600 },
    { id: 2, name: "Bluestone Lane", category: "Food", date: new Date(2026, 8, 26), cents: -725 },
    { id: 1, name: "Uniqlo", category: "Shopping", date: new Date(2026, 8, 22), cents: -4990 },
  ],
  nextId: 9,
  selected: null,
  undo: [],
  arrived: null,
}

const sameDay = (a, b) => a.toDateString() === b.toDateString()
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n)
const shortDate = (d) => d.toLocaleDateString("en-US", { month: "short", day: "numeric" })
const friendlyDate = (d) => sameDay(d, TODAY) ? "today" : sameDay(d, addDays(TODAY, -1)) ? "yesterday" : d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })
const money = (cents) => (cents > 0 ? "+" : "") + "$" + (Math.abs(cents) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
const kept = () => state.rows.filter((r) => !r.discarded)
const words = () => VOCAB[state.vocab]

function latestOnOrBefore(month, day) {
  let d = new Date(TODAY.getFullYear(), month, day)
  if (d.getMonth() !== month) return null
  if (d > TODAY) d = new Date(TODAY.getFullYear() - 1, month, day)
  return d
}

// Throwaway copy of the grammar, returns token spans so flows can highlight them.
function read(line) {
  const parts = [...line.matchAll(/\S+/g)].map((m) => ({ text: m[0], start: m.index, end: m.index + m[0].length, kind: null }))
  let date = null, amount = null, category = null
  for (let i = 0; i < parts.length - 1 && !date; i++) {
    const m = MONTHS.indexOf(parts[i].text.toLowerCase().slice(0, 3))
    if (m >= 0 && /^[a-z]+$/i.test(parts[i].text) && /^\d{1,2}$/.test(parts[i + 1].text)) {
      const d = latestOnOrBefore(m, +parts[i + 1].text)
      if (d) { date = d; parts[i].kind = parts[i + 1].kind = "date" }
    }
  }
  for (const p of parts) {
    if (p.kind) continue
    const t = p.text.toLowerCase()
    if (!date) {
      let d = null
      let m
      if (t === "today") d = TODAY
      else if (t === "yesterday") d = addDays(TODAY, -1)
      else if (WEEKDAYS.includes(t)) d = addDays(TODAY, -((TODAY.getDay() - WEEKDAYS.indexOf(t) + 7) % 7))
      else if ((m = t.match(/^(\d{1,2})\/(\d{1,2})$/))) d = latestOnOrBefore(+m[1] - 1, +m[2])
      else if ((m = t.match(/^(\d{4})-(\d{2})-(\d{2})$/))) d = new Date(+m[1], +m[2] - 1, +m[3])
      if (d) { date = d; p.kind = "date"; continue }
    }
    if (!category && /^#\w/.test(p.text)) { category = p.text.slice(1); p.kind = "category"; continue }
    let m
    if (amount === null && (m = p.text.match(/^(\+)?\$?(\d+)(?:\.(\d{1,2}))?$/))) {
      const cents = +m[2] * 100 + +(m[3] || "0").padEnd(2, "0")
      amount = m[1] ? cents : -cents
      p.kind = "amount"
    }
  }
  const name = parts.filter((p) => !p.kind).map((p) => p.text).join(" ")
  let inferred = false
  if (!category && name) {
    const hit = kept().find((r) => r.name.toLowerCase() === name.toLowerCase())
    if (hit) { category = hit.category; inferred = true }
  } else if (category) {
    const hit = kept().find((r) => r.category.toLowerCase() === category.toLowerCase())
    if (hit) category = hit.category
  }
  const errors = []
  if (amount === null) errors.push("Add an amount")
  if (!name) errors.push("Add a name")
  return { line, parts, name, cents: amount, category, inferred, date: date || TODAY, explicitDate: !!date, errors }
}

function completionsFor(line, caret) {
  const before = line.slice(0, caret)
  const token = before.match(/(#?\S*)$/)[1]
  if (!token) return { token, start: caret, items: [] }
  const start = caret - token.length
  const q = token.replace(/^#/, "").toLowerCase()
  let pool
  if (token.startsWith("#")) {
    pool = [...new Set(kept().map((r) => r.category))].map((c) => ({ value: "#" + c, label: "#" + c, hint: "" }))
  } else if (start === 0 || /^[a-z' ]+$/i.test(before)) {
    const tally = {}
    for (const r of kept()) (tally[r.name] ||= { n: 0, cat: r.category }).n++
    pool = Object.entries(tally).map(([n, v]) => ({ value: n, label: n, hint: v.cat, n: v.n }))
    return rank(pool, before.toLowerCase(), 0)
  } else pool = []
  return rank(pool, q, start)
  function rank(pool, q, start) {
    if (!q) return { token, start, items: [] }
    const key = (s) => s.toLowerCase().replace(/^#/, "")
    const prefix = pool.filter((p) => key(p.value).startsWith(q) && key(p.value) !== q)
    const contains = pool.filter((p) => !key(p.value).startsWith(q) && key(p.value).includes(q))
    const by = (a, b) => (b.n || 0) - (a.n || 0)
    return { token, start, items: [...prefix.sort(by), ...contains.sort(by)].slice(0, 8) }
  }
}

function commit(r, replaceId) {
  if (r.errors.length) return false
  const row = { id: state.nextId++, name: r.name, category: r.category || "Uncategorized", date: r.date, cents: r.cents, line: r.line }
  state.rows.unshift(row)
  state.undo.push({ kind: "add", id: row.id })
  state.arrived = row.id
  toast(`${words().added} ${row.name}. Press u to undo.`)
  render()
  return true
}

function discardSelected() {
  const row = kept()[state.selected]
  if (!row) return
  row.discarded = true
  state.undo.push({ kind: "discard", id: row.id })
  state.selected = Math.min(state.selected, kept().length - 1)
  toast(words().deleted)
  render()
}

function undo() {
  const op = state.undo.pop()
  if (!op) return toast("Nothing to undo.")
  const row = state.rows.find((r) => r.id === op.id)
  if (op.kind === "add") row.discarded = true
  else { row.discarded = false; state.arrived = row.id }
  toast("Undone.")
  render()
}

let toastTimer
function toast(text) {
  const el = document.getElementById("toast")
  el.textContent = text
  el.hidden = false
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => (el.hidden = true), 3200)
}

function rowHtml(row, i) {
  const selected = i === state.selected
  return `<li class="flex items-center gap-3 border-b border-secondary py-3 last:border-b-0 ${row.id === state.arrived ? "arrived" : ""} ${selected ? "bg-level-1" : ""}" aria-selected="${selected}">
    <div class="flex w-2 shrink-0 justify-center">${selected || row.id === state.arrived ? '<div class="size-1.5 rounded-[1px] bg-highlight"></div>' : ""}</div>
    <div class="flex min-w-0 flex-1 flex-col gap-0.5">
      <p class="truncate font-medium">${esc(row.name)}</p>
      <p class="text-sm text-tertiary">${esc(row.category)} · ${shortDate(row.date)}</p>
    </div>
    <p class="w-[90px] shrink-0 text-right font-mono ${row.cents > 0 ? "text-success" : ""}">${money(row.cents)}</p>
  </li>`
}

function renderList() {
  const rows = kept().slice(0, 6)
  const draft = state.flow === "row" ? draftRowHtml() : ""
  document.getElementById("rows").innerHTML = draft + (rows.length ? rows.map(rowHtml).join("") : `<li class="py-6 text-secondary">${words().emptyRecent}</li>`)
  const month = kept().filter((r) => r.date.getMonth() === 9 && r.cents < 0)
  document.getElementById("total").textContent = money(-month.reduce((s, r) => s - r.cents, 0)).replace("+", "")
  document.getElementById("count").textContent = `${month.length} this month`
  document.getElementById("span").textContent = `${kept().length} ${words().many} since Feb 2025`
  document.getElementById("pace").innerHTML = Array.from({ length: 31 }, (_, d) => `<div class="h-2.5 flex-1 rounded-[2px] ${d < 4 ? "bg-highlight" : "bg-data-track"}"></div>`).join("")
  if (state.flow === "row") wireDraftRow()
}

function render() {
  document.querySelectorAll("[data-word]").forEach((el) => (el.textContent = words()[el.dataset.word]))
  document.querySelectorAll("[data-flow]").forEach((b) => b.className = `rounded-sm px-2 py-1 cursor-pointer ${b.dataset.flow === state.flow ? "bg-level-3 font-medium text-primary" : "text-secondary"}`)
  document.querySelectorAll("[data-vocab]").forEach((b) => b.className = `rounded-sm px-2 py-1 cursor-pointer ${b.dataset.vocab === state.vocab ? "bg-level-3 font-medium text-primary" : "text-secondary"}`)
  renderList()
  setTimeout(() => (state.arrived = null), 0)
}

/* Flow 1. Bar and pills: the mockup as drawn, pills read the line, popup completes. */
function mountBar() {
  document.getElementById("entry").innerHTML = `
  <form class="relative" id="bar-form" autocomplete="off">
    <div class="flex h-15 shrink-0 items-center gap-3 rounded-lg border border-primary bg-level-2 pr-2 pl-5 shadow-xs">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" class="shrink-0 stroke-(--background-color-data)" aria-hidden="true"><path d="M9 3v12M3 9h12" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="line" type="text" aria-label="Quick add" placeholder="${words().placeholder}" class="min-w-0 flex-1 bg-transparent text-md outline-none placeholder:text-tertiary">
      <div id="pills" class="hidden gap-1.5 sm:flex"></div>
      <button type="submit" class="shrink-0 cursor-pointer rounded-md bg-action px-4 py-2.5 font-pixel text-[15px] leading-[18px] font-semibold whitespace-nowrap tracking-pixel text-on-action hover:brightness-95">${words().button} ↵</button>
    </div>
    <ul id="popup" hidden class="absolute inset-x-0 top-full z-10 mt-1.5 overflow-hidden rounded-lg border border-primary bg-level-2 shadow-xs"></ul>
  </form>`
  const input = document.getElementById("line"), pills = document.getElementById("pills"), popup = document.getElementById("popup")
  let menu = { items: [] }, active = 0
  const pill = (text, cls = "") => `<span class="rounded-full bg-level-3 px-2.5 py-1 text-sm font-medium ${cls}">${esc(text)}</span>`
  function update() {
    const v = input.value
    const r = read(v)
    pills.innerHTML = !v.trim() ? "" : r.errors.length && r.name && r.cents === null ? pill(r.errors[0], "font-sans text-danger")
      : r.errors.length ? pill(r.errors[0], "font-sans text-danger")
      : pill(money(r.cents), `font-mono ${r.cents > 0 ? "text-success" : ""}`) + pill(r.category || "Uncategorized", "font-sans") + pill(shortDate(r.date), "font-sans")
    menu = completionsFor(v, input.selectionStart); active = 0; drawMenu()
  }
  function drawMenu() {
    popup.hidden = !menu.items.length
    popup.innerHTML = menu.items.map((it, i) => `<li data-i="${i}" class="flex cursor-pointer items-center justify-between gap-3 px-5 py-2.5 ${i === active ? "bg-level-3" : ""}"><span class="truncate">${esc(it.label)}</span><span class="shrink-0 text-sm text-tertiary">${esc(it.hint)}</span></li>`).join("")
  }
  function accept(i) {
    const it = menu.items[i]; const caret = input.selectionStart
    input.value = input.value.slice(0, menu.start) + it.value + " " + input.value.slice(caret).replace(/^\S*\s?/, "")
    input.setSelectionRange(menu.start + it.value.length + 1, menu.start + it.value.length + 1)
    update(); menu = { items: [] }; drawMenu()
  }
  input.addEventListener("input", update)
  input.addEventListener("keydown", (e) => {
    if (menu.items.length && !popup.hidden) {
      if (e.key === "ArrowDown") { active = (active + 1) % menu.items.length; drawMenu(); return e.preventDefault() }
      if (e.key === "ArrowUp") { active = (active - 1 + menu.items.length) % menu.items.length; drawMenu(); return e.preventDefault() }
      if (e.key === "Tab" || (e.key === "Enter" && menu.items.length)) { accept(active); return e.preventDefault() }
      if (e.key === "Escape") { popup.hidden = true; return e.preventDefault() }
    }
  })
  popup.addEventListener("mousedown", (e) => { const li = e.target.closest("li"); if (li) { e.preventDefault(); accept(+li.dataset.i) } })
  document.getElementById("bar-form").addEventListener("submit", (e) => {
    e.preventDefault()
    const r = read(input.value)
    if (!input.value.trim()) return
    if (commit(r)) { input.value = ""; update() } else update()
  })
}

/* Flow 2. Read-back: tokens light up inside the field, a sentence below says how it was read, ghost text completes. */
function mountReadback() {
  document.getElementById("entry").innerHTML = `
  <form class="flex flex-col gap-2.5" id="rb-form" autocomplete="off">
    <div class="flex h-15 shrink-0 items-center gap-3 rounded-lg border border-primary bg-level-2 pr-2 pl-5 shadow-xs">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" class="shrink-0 stroke-(--background-color-data)" aria-hidden="true"><path d="M9 3v12M3 9h12" stroke-width="1.8" stroke-linecap="round"/></svg>
      <div class="relative min-w-0 flex-1 overflow-hidden">
        <div id="mirror" aria-hidden="true" class="mirror pointer-events-none absolute inset-0 flex items-center"></div>
        <input id="line" type="text" aria-label="Quick add" class="mirror-input relative w-full bg-transparent outline-none">
      </div>
      <button type="submit" class="shrink-0 cursor-pointer rounded-md bg-action px-4 py-2.5 font-pixel text-[15px] leading-[18px] font-semibold whitespace-nowrap tracking-pixel text-on-action hover:brightness-95">${words().button} ↵</button>
    </div>
    <p id="reading" class="min-h-5 pl-5 text-md text-secondary"></p>
  </form>`
  const input = document.getElementById("line"), mirror = document.getElementById("mirror"), reading = document.getElementById("reading")
  let ghost = "", ghostFull = null
  function update() {
    const v = input.value
    const r = read(v)
    ghost = ""; ghostFull = null
    if (v && input.selectionStart === v.length) {
      const c = completionsFor(v, v.length)
      const typed = v.slice(c.start)
      if (c.items[0] && c.items[0].value.toLowerCase().startsWith(typed.toLowerCase())) {
        ghost = c.items[0].value.slice(typed.length)
        ghostFull = { start: c.start, value: c.items[0].value }
      }
    }
    let html = "", at = 0
    for (const p of r.parts) {
      html += esc(v.slice(at, p.start))
      html += p.kind ? `<span class="tok-${p.kind}">${esc(p.text)}</span>` : esc(p.text)
      at = p.end
    }
    html += esc(v.slice(at))
    mirror.innerHTML = `<span>${v ? html + `<span class="text-tertiary">${esc(ghost)}</span>` : `<span class="text-tertiary">${words().placeholder}</span>`}</span>`
    if (!v.trim()) { reading.innerHTML = `<span class="text-tertiary">Try: coffee 5.50 yesterday #food</span>`; return }
    const gap = (t) => `<span class="rounded-sm border border-dashed border-primary px-1.5 text-danger">${t}</span>`
    const amount = r.cents === null ? gap("how much?") : `<span class="font-mono font-medium ${r.cents > 0 ? "text-success" : "text-primary"}">${money(r.cents).replace("+", "")}</span>`
    const name = r.name ? `<span class="font-medium text-primary">${esc(r.name)}</span>` : gap("what for?")
    const verb = r.cents > 0 ? "Got" : "Spent"
    const prep = r.cents > 0 ? "from" : "on"
    const cat = r.category ? `<span class="font-medium text-primary">${esc(r.category)}</span>${r.inferred ? ` <span class="text-tertiary">(like last time)</span>` : ""}` : `<span class="text-tertiary">Uncategorized</span>`
    reading.innerHTML = `${verb} ${amount} ${prep} ${name}, ${friendlyDate(r.date)} · ${cat}`
  }
  input.addEventListener("input", update)
  input.addEventListener("keyup", (e) => ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key) && update())
  input.addEventListener("keydown", (e) => {
    if ((e.key === "Tab" || e.key === "ArrowRight") && ghost && input.selectionStart === input.value.length) {
      input.value = input.value.slice(0, ghostFull.start) + ghostFull.value + " "; update(); e.preventDefault()
    }
  })
  input.addEventListener("scroll", () => (mirror.style.transform = `translateX(${-input.scrollLeft}px)`))
  document.getElementById("rb-form").addEventListener("submit", (e) => {
    e.preventDefault()
    if (!input.value.trim()) return
    if (commit(read(input.value))) { input.value = ""; update() } else {
      reading.animate([{ transform: "translateX(0)" }, { transform: "translateX(-4px)" }, { transform: "translateX(4px)" }, { transform: "translateX(0)" }], { duration: 180 })
    }
  })
  update()
}

/* Flow 3. Draft row: no separate bar. The top row of the list is the line, and it renders exactly as it will save. */
let draftValue = ""
function mountRow() {
  document.getElementById("entry").innerHTML = ""
}
function draftRowHtml() {
  return `<li class="flex items-center gap-3 rounded-md border border-primary bg-level-2 px-0 py-3 shadow-xs" id="draft-row">
    <div class="flex w-2 shrink-0 justify-center pl-3"><svg width="12" height="12" viewBox="0 0 18 18" fill="none" class="stroke-(--background-color-data)" aria-hidden="true"><path d="M9 3v12M3 9h12" stroke-width="2.2" stroke-linecap="round"/></svg></div>
    <div class="relative flex min-w-0 flex-1 flex-col gap-0.5 pl-2">
      <input id="line" type="text" aria-label="Quick add" autocomplete="off" value="${esc(draftValue)}" placeholder="${words().draftRow}" class="min-w-0 bg-transparent font-medium outline-none placeholder:font-normal placeholder:text-tertiary">
      <p id="draft-meta" class="text-sm text-tertiary"></p>
      <ul id="popup" hidden class="absolute inset-x-0 top-full z-10 mt-2 overflow-hidden rounded-lg border border-primary bg-level-2 shadow-xs"></ul>
    </div>
    <p id="draft-amount" class="w-[90px] shrink-0 pr-3 text-right font-mono"></p>
  </li>`
}
function wireDraftRow() {
  const input = document.getElementById("line"), meta = document.getElementById("draft-meta"), amount = document.getElementById("draft-amount"), popup = document.getElementById("popup")
  let menu = { items: [] }, active = 0
  function update() {
    draftValue = input.value
    const r = read(draftValue)
    if (!draftValue.trim()) { meta.textContent = "Try: coffee 5.50 yesterday #food"; amount.innerHTML = ""; }
    else {
      const missing = r.errors[0] ? `<span class="text-danger">${r.errors[0]}</span> · ` : ""
      meta.innerHTML = missing + `${esc(r.category || "Uncategorized")}${r.inferred ? " (like last time)" : ""} · ${shortDate(r.date)}`
      amount.innerHTML = r.cents === null ? "" : `<span class="${r.cents > 0 ? "text-success" : ""}">${money(r.cents)}</span>`
    }
    menu = completionsFor(draftValue, input.selectionStart); active = 0; drawMenu()
  }
  function drawMenu() {
    popup.hidden = !menu.items.length
    popup.innerHTML = menu.items.map((it, i) => `<li data-i="${i}" class="flex cursor-pointer items-center justify-between gap-3 px-4 py-2.5 ${i === active ? "bg-level-3" : ""}"><span class="truncate">${esc(it.label)}</span><span class="shrink-0 text-sm text-tertiary">${esc(it.hint)}</span></li>`).join("")
  }
  function accept(i) {
    const it = menu.items[i], caret = input.selectionStart
    input.value = input.value.slice(0, menu.start) + it.value + " " + input.value.slice(caret).replace(/^\S*\s?/, "")
    input.setSelectionRange(menu.start + it.value.length + 1, menu.start + it.value.length + 1)
    update(); menu = { items: [] }; drawMenu()
  }
  input.addEventListener("input", update)
  input.addEventListener("keydown", (e) => {
    if (menu.items.length && !popup.hidden) {
      if (e.key === "ArrowDown") { active = (active + 1) % menu.items.length; drawMenu(); return e.preventDefault() }
      if (e.key === "ArrowUp") { active = (active - 1 + menu.items.length) % menu.items.length; drawMenu(); return e.preventDefault() }
      if (e.key === "Tab") { accept(active); return e.preventDefault() }
      if (e.key === "Escape") { popup.hidden = true; return e.preventDefault() }
    }
    if (e.key === "Enter") {
      e.preventDefault()
      if (!input.value.trim()) return
      const r = read(input.value)
      if (r.errors.length) { document.getElementById("draft-row").animate([{ transform: "translateX(0)" }, { transform: "translateX(-4px)" }, { transform: "translateX(4px)" }, { transform: "translateX(0)" }], { duration: 180 }); return }
      draftValue = ""
      commit(r)
      document.getElementById("line").focus()
    }
  })
  popup.addEventListener("mousedown", (e) => { const li = e.target.closest("li"); if (li) { e.preventDefault(); accept(+li.dataset.i) } })
  update()
}

function setFlow(flow) {
  state.flow = flow
  try { localStorage.setItem("flow", flow) } catch {}
  ;({ bar: mountBar, readback: mountReadback, row: mountRow })[flow]()
  render()
}

let lastD = 0
document.addEventListener("keydown", (e) => {
  if (e.altKey && ["1", "2", "3"].includes(e.key)) { setFlow(["bar", "readback", "row"][+e.key - 1]); return e.preventDefault() }
  if (e.target.tagName === "INPUT") { if (e.key === "Escape") e.target.blur(); return }
  if (e.metaKey || e.ctrlKey || e.altKey) return
  if (e.key === "n" || e.key === "/") { document.getElementById("line")?.focus(); return e.preventDefault() }
  if (e.key === "j") { state.selected = Math.min((state.selected ?? -1) + 1, Math.min(kept().length, 6) - 1); render() }
  if (e.key === "k") { state.selected = Math.max((state.selected ?? 1) - 1, 0); render() }
  if (e.key === "u") undo()
  if (e.key === "d") { if (Date.now() - lastD < 600) { discardSelected(); lastD = 0 } else lastD = Date.now() }
})
document.querySelectorAll("[data-flow]").forEach((b) => b.addEventListener("click", () => setFlow(b.dataset.flow)))
document.querySelectorAll("[data-vocab]").forEach((b) => b.addEventListener("click", () => { state.vocab = b.dataset.vocab; try { localStorage.setItem("vocab", state.vocab) } catch {} ; setFlow(state.flow) }))
document.querySelectorAll("[data-theme-set]").forEach((b) => b.addEventListener("click", () => (document.documentElement.dataset.theme = b.dataset.themeSet)))
const params = new URLSearchParams(location.search)
if (params.get("flow")) state.flow = params.get("flow")
if (params.get("vocab")) state.vocab = params.get("vocab")
if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme")
setFlow(state.flow)
</script>
</body>
</html>
