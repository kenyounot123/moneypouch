# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# Plain conditionals: no endless methods, no `x or return`, no assignment inside a condition,
# and an if/elsif chain that compares one value three or more times reads as a case.
Style/EndlessMethod:
  Enabled: true
  EnforcedStyle: disallow

Style/AndOr:
  Enabled: true
  EnforcedStyle: always

Lint/AssignmentInCondition:
  Enabled: true
  AllowSafeAssignment: false

Style/CaseLikeIf:
  Enabled: true
  MinBranchesCount: 3
